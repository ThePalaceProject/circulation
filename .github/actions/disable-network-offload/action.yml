name: 'Disable network offload'
description: 'Turn off TX and RX checksum offload on the runner network interface'

# See comment here: https://github.com/actions/runner-images/issues/1187#issuecomment-686735760
# Do not hard-code eth0. Some runner images may give the network interface a different name,
# so use the interface on the default route. The interface list helps debug failures.
runs:
  using: "composite"
  steps:
    - run: |
        ip -o link
        iface="$(ip -o route show default | awk '{print $5; exit}')"
        if [ -z "$iface" ]; then
          echo "::error::No network interface found on the default route."
          exit 1
        fi
        echo "Using interface: $iface"
        sudo ethtool -K "$iface" tx off rx off
      shell: bash
