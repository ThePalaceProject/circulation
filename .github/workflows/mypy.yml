name: Mypy (Type check)
on: [push, pull_request]
env:
  PYTHON_VERSION: "3.12"

jobs:
  mypy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # palace-brainfuck-utils depends on palace-brainfuck-vm, a Rust
        # extension that uv builds from source via maturin as part of
        # `uv sync`, so a toolchain has to be on PATH before that runs.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/palace-brainfuck-vm

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true

      - name: Install Python Packages 📦
        run: uv sync --frozen --no-group ci

      - name: Run MyPy 🪄
        run: mypy
